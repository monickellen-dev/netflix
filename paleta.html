<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./css/paleta.css">
        <title>Paleta de cores</title>
    </head>
    <body>
       
        <h1>Paleta de cores</h1>

        <ul class="paleta">
            <li style="background-color:#E50914; color: #fff;">
                <p>Vermelho</p>
                <p>#E50914;</p>
            </li>
            <li style="background-color:#ae161e; color: #fff;">
                <p>Vermelho escuro</p>
                <p>#ae161e;</p>
            </li>
            <li style="background-color:#4d4c4c; color: #fff;">
                <p>Cinza</p>
                <p>#4d4c4c;</p>
            </li>
            <li style="background-color:#404040; color: #fff;">
                <p>Cinza escuro</p>
                <p>#404040;</p>
            </li>
            <li style="background-color:#F2F2F2; color: #000;">
                <p>Cinza claro</p>
                <p>#F2F2F2;</p>
            </li>
            <li style="background-color:#1d1d1d; color: #fff;">
                <p>Preto</p>
                <p>#1d1d1d;</p>
            </li>
            <li style="background:linear-gradient(180deg, #33080c 0%, #170305 45%, #000000 80%); color: #fff;">
                <p>Gradiente</p>
                <p>linear-gradient(180deg, #33080c 0%, #170305 45%, #000000 80%);</p>
            </li>     
        </ul>
    </body>
</html>
