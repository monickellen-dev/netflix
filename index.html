<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./css/cadastro.css">
        <title>Título aqui</title>
    </head>
    <body>
        <div>
            <section>
                <header>
                    <img src="./img/logotipo.png" alt="NETFLIX">
                    <button type="button">Entrar</button>
                </header>
                <main>
                    <p>Passo <strong>2</strong> de <strong>3</strong></p>
                    <h1>Crie uma senha para iniciar sua assinatura</h1>
                    <p>Falta só mais alguns passos!</p>
                    <p>Nós também detestamos formulários</p>
                    <form name="cadrastro" method="post">
                        <div class="field">
                            <label for="email">E-mail:</label>
                            <input type="email" name="email" id="email" placeholder="exemplo@gmail.com" required>
                        </div>
                        <div class="field">
                            <label for="senha">Senha:</label>
                            <input type="password" name="senha" id="senha" required>
                        </div>
                        <button type="submit">Próximo</button>
                    </form>
                </main>
            </section>
            <footer>
                <p>Dúvidas? ligue para 0800 591 8943 (ligação grátis)</p>
                <select name="idioma">
                    <option value="portugues">Português</option>
                    <option value="ingles">Inglês</option>
                    <option value="frances">Francês</option>
                    <option value="espanhol">Espanhol</option>
                </select>
            </footer>
        </div>
    </body>
</html>
